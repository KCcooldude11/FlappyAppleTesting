<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>POW Symbol Shape Demo</title>
  <style>
    body { background: #222; color: #fff; font-family: sans-serif; }
    h1 { margin-top: 1em; }
    .row { display: flex; gap: 32px; margin-bottom: 32px; }
    canvas { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px #000a; }
    .label { text-align: center; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>POW Symbol Shape Iterations</h1>
  <div class="row">
    <div>
      <canvas id="pow1" width="200" height="120"></canvas>
      <div class="label">Symmetrical (8 spikes)</div>
    </div>
    <div>
      <canvas id="pow2" width="200" height="120"></canvas>
      <div class="label">Symmetrical (12 spikes)</div>
    </div>
    <div>
      <canvas id="pow3" width="200" height="120"></canvas>
      <div class="label">Organic (random spikes)</div>
    </div>
    <div>
      <canvas id="pow4" width="200" height="120"></canvas>
      <div class="label">Organic (wavy, uneven)</div>
    </div>
  </div>
  <script>
    function drawPow(ctx, opts) {
      const {
        cx = 100, cy = 60, rx = 70, ry = 40,
        spikes = 10, spikeLength = 20, symmetry = true, organic = false
      } = opts;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.beginPath();
      let angleStep = (Math.PI * 2) / spikes;
      for (let i = 0; i < spikes; i++) {
        let angle = i * angleStep;
        let r1 = rx, r2 = rx + spikeLength;
        let r1y = ry, r2y = ry + spikeLength * 0.7;
        if (organic) {
          // Add randomness to spikes
          let rand = 0.7 + Math.random() * 0.6;
          r2 *= rand;
          r2y *= rand;
        }
        if (!symmetry && i % 2 === 1) {
          r2 *= 0.7;
          r2y *= 0.7;
        }
        let x1 = Math.cos(angle) * r1;
        let y1 = Math.sin(angle) * r1y;
        let x2 = Math.cos(angle + angleStep / 2) * r2;
        let y2 = Math.sin(angle + angleStep / 2) * r2y;
        if (i === 0) ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineTo(Math.cos(angle + angleStep) * r1, Math.sin(angle + angleStep) * r1y);
      }
      ctx.closePath();
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
    // Symmetrical 20 spikes
    drawPow(document.getElementById('pow1').getContext('2d'), {
      spikes: 20, rx: 70, ry: 40, spikeLength: 22, symmetry: true, organic: false
    });
    // Symmetrical 32 spikes
    drawPow(document.getElementById('pow2').getContext('2d'), {
      spikes: 32, rx: 65, ry: 38, spikeLength: 18, symmetry: true, organic: false
    });
    // Organic random spikes (24)
    drawPow(document.getElementById('pow3').getContext('2d'), {
      spikes: 24, rx: 68, ry: 42, spikeLength: 24, symmetry: false, organic: true
    });
    // Organic wavy uneven (30)
    drawPow(document.getElementById('pow4').getContext('2d'), {
      spikes: 30, rx: 60, ry: 36, spikeLength: 26, symmetry: false, organic: true
    });
  </script>
</body>
</html>
